<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />

    <!-- Responsive + zoom support (required) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Helps accessibility in mobile UI theming -->
    <meta name="theme-color" content="#122C71" />

    <!-- Site has a light theme only; declaring "light dark" made dark-mode devices render native controls and unstyled areas dark -->
    <meta name="color-scheme" content="light" />

    <meta name="author" content="Restorative Health Care HHS" />

    <meta
      name="description"
      content="Restorative Care HHS provides professional in-home health care, skilled nursing, and personal care services to support comfort, independence, and wellbeing for patients at home."
    />

    <meta
      name="keywords"
      content="home health care, skilled nursing, CNA, LVN, PRN, personal care, physical therapy, occupational therapy, wound care, Restorative Care HHS, Dallas Texas, Irving Texas, Bedford Texas"
    />

    <!-- Open Graph (SEO + accessibility context for shared links) -->
    <meta property="og:title" content="Restorative Care HHS – Home Health Care Services in Texas" />
    <meta
      property="og:description"
      content="Professional in-home health care services including skilled nursing, personal care, therapy, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://restorativecarehhs.com" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- IMPROVED ACCESSIBLE TITLE -->
    <title>Restorative Care HHS – Home Health Care Services in Texas</title>
  </head>

  <body>
    <!-- Apply saved text-size / contrast / link preferences before React
         loads so there's no flash of the default view. Keep the storage key
         in sync with AccessibilityControls.js. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("rc-a11y-prefs"));
        if (p) {
          var r = document.documentElement;
          var sizes = [18, 20, 22, 24];
          if (p.size > 0 && p.size < sizes.length) r.style.fontSize = sizes[p.size] + "px";
          if (p.contrast) r.classList.add("a11y-contrast");
          if (p.links) r.classList.add("a11y-links");
        }
      } catch (e) {}
    </script>
    <!-- Improved accessibility fallback for no-JS users -->
    <noscript>
      <div role="alert">
        JavaScript is required to use this site. Please enable JavaScript to access full content and services.
      </div>
    </noscript>

    <div id="root"></div>
  </body>
</html>
