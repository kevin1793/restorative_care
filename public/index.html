<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />

    <!-- Responsive + zoom support (required) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Helps accessibility in mobile UI theming -->
    <meta name="theme-color" content="#122C71" />

    <!-- Site has a light theme only; declaring "light dark" made dark-mode devices render native controls and unstyled areas dark -->
    <meta name="color-scheme" content="light" />

    <meta name="author" content="Restorative Care Home Health Services, Inc." />
    <meta name="format-detection" content="telephone=yes" />

    <!--
      Preload the fonts used on every page. They are self-hosted, so the
      browser starts downloading them immediately instead of waiting for the
      CSS to be parsed first. `crossorigin` is required for font preloads,
      even same-origin, or the file is fetched twice.
    -->
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/merriweather-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Fonts are self-hosted (public/fonts) instead of loaded through Google's
      CSS @import. That removes render-blocking requests to a third-party
      domain and keeps visitors' browsers from contacting Google just to load
      the page. Latin subset only; each file is a variable font, so one file
      covers every weight. font-display: swap shows text immediately in a
      fallback font and swaps when the font arrives. Declared inline here
      (not in src/index.css) because CRA's webpack can't bundle root-relative
      url() paths. Inline styles are allowed by the CSP (style-src).
    -->
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/inter-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Merriweather";
        font-style: normal;
        font-weight: 300 900;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/merriweather-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Playwrite AU TAS";
        font-style: normal;
        font-weight: 100 400;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/playwrite-au-tas.woff2") format("woff2");
      }
    </style>

    <!--
      Applies the visitor's saved text size / contrast / link preferences
      before the page paints, so there's no flash of the default view. It is
      an external file (not inline) so the Content-Security-Policy can forbid
      inline scripts. Keep the storage key in sync with
      src/components/AccessibilityControls.js.
    -->
    <script src="%PUBLIC_URL%/a11y-init.js"></script>

    <!--
      Page-specific <title>, description, canonical URL and Open Graph /
      Twitter tags are written into each page's static HTML after the build
      by scripts/prerender.js (from src/seo/routes.js), and kept up to date in
      the browser by the <Seo /> component. The title below is only the
      fallback used by the dev server.
    -->
    <title>Restorative Care HHS – Home Health Care Services in Texas</title>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>

  <body>
    <!-- Improved accessibility fallback for no-JS users -->

</html>
